<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Wholesale Account Manager | TINTORO</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #242424;
      background: #f5f4f1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px 48px; }
    main { max-width: 1080px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: .04em; }
    h2 { margin: 0 0 16px; font-size: 18px; }
    a { color: #754f40; }
    .panel { padding: 22px; margin-bottom: 22px; background: #fff; border: 1px solid #e6e1dc; border-radius: 8px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; }
    input, textarea { display: block; width: 100%; margin-top: 6px; padding: 10px 11px; border: 1px solid #c9c4bf; border-radius: 4px; font: inherit; }
    textarea { min-height: 76px; resize: vertical; }
    .wide { grid-column: 1 / -1; }
    .checkbox { display: flex; align-items: center; gap: 8px; font-weight: 400; }
    .checkbox input { width: auto; margin: 0; }
    .actions { display: flex; gap: 9px; margin-top: 17px; }
    button { border: 0; border-radius: 4px; padding: 10px 15px; color: #fff; background: #754f40; font: inherit; cursor: pointer; }
    button.secondary { color: #333; background: #e9e5e1; }
    button.small { padding: 7px 9px; font-size: 12px; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 20px; margin: 0 0 12px; font-size: 14px; }
    #status[data-state="error"] { color: #a32121; }
    #status[data-state="success"] { color: #22623b; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 11px 9px; text-align: left; vertical-align: middle; border-bottom: 1px solid #ebe8e5; }
    th { white-space: nowrap; color: #5a514b; }
    td.controls { white-space: nowrap; }
    .inactive { color: #777; }
    .empty { color: #666; text-align: center; }
    @media (max-width: 640px) {
      body { padding: 20px 12px 32px; }
      header { align-items: flex-start; flex-direction: column; }
      .panel { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
    }
  </style>
  <script src="admin.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>TINTORO WHOLESALE ACCOUNTS</h1>
      <a href="../index.html">Back to wholesale site</a>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add wholesale account</h2>
      <p id="status" role="status" aria-live="polite"></p>
      <form id="account-form">
        <input id="account-id" type="hidden">
        <div class="form-grid">
          <label>Account number *
            <input id="account-number" name="account_number" maxlength="50" autocomplete="off" required>
          </label>
          <label>Store name *
            <input id="store-name" name="store_name" maxlength="120" required>
          </label>
          <label>Contact name
            <input id="contact-name" name="contact_name" maxlength="120">
          </label>
          <label>Phone
            <input id="phone" name="phone" type="tel" maxlength="40">
          </label>
          <label>Email
            <input id="email" name="email" type="email" maxlength="254">
          </label>
          <label class="checkbox">
            <input id="is-active" name="is_active" type="checkbox" checked>
            Account is active
          </label>
          <label class="wide">Store address
            <textarea id="address" name="address" maxlength="500"></textarea>
          </label>
        </div>
        <div class="actions">
          <button id="save-button" type="submit">Add account</button>
          <button id="cancel-button" class="secondary" type="button">Clear form</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Saved accounts</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Account number</th>
              <th>Store</th>
              <th>Contact</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="account-list">
            <tr><td class="empty" colspan="7">Loading accounts…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
